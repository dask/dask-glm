[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dask-glm"
description = "Generalized Linear Models with Dask"
readme = "README.rst"
license = "BSD-3-Clause"
maintainers = [{ name = "Matthew Rocklin", email = "mrocklin@gmail.com" }]
keywords = ["dask", "glm", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "cloudpickle>=1.0",
    "dask[array]>=2022.1.0",
    "distributed>=2022.1.0",
    "multipledispatch>=0.6.0",
    "numba>=0.59",
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "sparse>=0.15",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "pre-commit>=3.0",
]
docs = [
    "jupyter",
    "nbsphinx",
    "notebook",
    "numpydoc",
    "sphinx",
    "sphinx_rtd_theme",
]

[project.urls]
Homepage = "https://github.com/dask/dask-glm"
Documentation = "https://dask-glm.readthedocs.io"
Repository = "https://github.com/dask/dask-glm"

[tool.setuptools]
packages = ["dask_glm"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["dask_glm/tests"]
addopts = "-v"
